<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>MedBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="header">🏥 MedBridge</div>

        <div class="card">

            <h2 id="title"></h2>

            <form action="summary.php" method="POST">

                <label id="label-body"></label>
                <select name="body" id="bodySelect"></select>

                <label id="label-symptom"></label>
                <select name="symptom" id="symptomSelect"></select>

                <label id="label-pain"></label>
                <input type="number" name="pain">

                <label id="label-duration"></label>
                <select name="duration" id="durationSelect"></select>

                <label id="label-notes"></label>
                <textarea name="notes" id="notes"></textarea>

                <button type="button" onclick="startVoice()">🎤 Speak</button>

                <label>📄 Upload Document</label>
                <input type="file" id="fileInput" accept=".txt">

                <button type="button" onclick="handleFile()">Translate File</button>

                <textarea id="translatedText" placeholder="Translated text will appear here"></textarea>

                <button id="submit-btn" type="submit"></button>

            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
