<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">🩺 MedBridge</div>

    <div class="app">
        <div class="card">

            <h2 id="title">Enter Symptoms</h2>

            <form action="summary.php" method="POST">

                <label>Body Part</label>
                <div class="dropdown">
                    <div class="dropdown-selected" onclick="toggleDropdown('bodyDropdown')">Select Body</div>
                    <div class="dropdown-options" id="bodyDropdown"></div>
                    <input type="hidden" name="body" id="bodyInput">
                </div>

                <label>Symptom</label>
                <div class="dropdown">
                    <div class="dropdown-selected" onclick="toggleDropdown('symptomDropdown')">Select Symptom</div>
                    <div class="dropdown-options" id="symptomDropdown"></div>
                    <input type="hidden" name="symptom" id="symptomInput">
                </div>

                <label>Pain Level</label>
                <input type="number" name="pain">

                <label>Duration</label>
                <select name="duration" id="durationSelect"></select>

                <label>Notes</label>
                <textarea name="notes" id="notes"></textarea>

                <button type="button" class="mic-btn" onclick="startVoice()">🎤 Speak</button>

                <label>Upload Document</label>
                <input type="file" id="fileInput">

                <button type="button" onclick="handleFile()">Translate File</button>

                <textarea id="translatedText"></textarea>

                <button type="submit">Generate Summary</button>

            </form>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
